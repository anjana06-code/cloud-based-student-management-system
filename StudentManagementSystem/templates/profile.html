{% extends "base.html" %}

{% block title %}My Profile - Student Management System{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 600px;">
    <div class="form-card-header">
        <h2>Student Profile Information</h2>
        <p>Update your academic and personal details</p>
    </div>

    <form action="{{ url_for('student.profile') }}" method="POST">
        <div class="form-group">
            <label for="email">Email Address (Read-Only ID)</label>
            <input type="email" id="email" class="form-control" value="{{ student['email'] }}" disabled style="background-color: #f1f5f9; cursor: not-allowed;">
        </div>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ student['name'] }}" required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department" class="form-control">
                <option value="Computer Science" {% if student['department'] == 'Computer Science' %}selected{% endif %}>Computer Science & Engineering</option>
                <option value="Information Technology" {% if student['department'] == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                <option value="Electrical Engineering" {% if student['department'] == 'Electrical Engineering' %}selected{% endif %}>Electrical Engineering</option>
                <option value="Mechanical Engineering" {% if student['department'] == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                <option value="Civil Engineering" {% if student['department'] == 'Civil Engineering' %}selected{% endif %}>Civil Engineering</option>
            </select>
        </div>

        <div class="form-group" style="display: flex; gap: 1rem;">
            <div style="flex: 1;">
                <label for="year">Academic Year</label>
                <select id="year" name="year" class="form-control">
                    <option value="1" {% if student['year'] == 1 %}selected{% endif %}>1st Year</option>
                    <option value="2" {% if student['year'] == 2 %}selected{% endif %}>2nd Year</option>
                    <option value="3" {% if student['year'] == 3 %}selected{% endif %}>3rd Year</option>
                    <option value="4" {% if student['year'] == 4 %}selected{% endif %}>4th Year</option>
                </select>
            </div>
            <div style="flex: 2;">
                <label for="course">Degree / Course</label>
                <input type="text" id="course" name="course" class="form-control" value="{{ student['course'] }}" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Save Profile Changes</button>
    </form>
</div>
{% endblock %}
